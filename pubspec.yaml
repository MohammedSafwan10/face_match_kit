name: face_match_kit
description: On-device face detection, guided enrollment, liveness challenges, and 1:1 verification for Flutter.
version: 0.1.0
homepage: https://github.com/MohammedSafwan10/face_match_kit
repository: https://github.com/MohammedSafwan10/face_match_kit
issue_tracker: https://github.com/MohammedSafwan10/face_match_kit/issues

platforms:
  android:
  ios:

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - dnn
        - objdetect
        - calib3d
topics:
  - face-detection
  - face-verification
  - biometrics
  - on-device-ml
  - liveness

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  camera: ^0.12.0
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_litert: ^3.5.1
  image: ^4.3.0
  opencv_dart: ^2.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/face_detection_yunet_2023mar.onnx
    - assets/models/face_recognition_sface_2021dec_int8.onnx
    - assets/models/face_landmarks_detector.tflite
    - assets/models/face_blendshapes.tflite

screenshots:
  - description: Face Match Kit on-device enrollment and verification hero.
    path: doc/screenshots/hero-ai.png
  - description: Face Match Kit enrollment and verification workflow.
    path: doc/screenshots/overview.png
